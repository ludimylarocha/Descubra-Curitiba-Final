<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descubra Curitiba</title>
<style>
:root{--bg:#f6f4ec;--sf:#fff;--tx:#1d2b24;--mu:#5c6b63;--g:#2e7d5b;--gd:#1f5c42;--au:#e3a72f;--bd:#dcd8c8;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--sf:#1b2621;--tx:#eaf1ec;--mu:#a3b3aa;--g:#5cb88c;--gd:#3f9b72;--au:#f0bb4a;--bd:#2c3b34;--on:#0e1511;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a16;--sf:#1b2621;--tx:#eaf1ec;--mu:#a3b3aa;--g:#5cb88c;--gd:#3f9b72;--au:#f0bb4a;--bd:#2c3b34;--on:#0e1511;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
a{color:var(--gd)}.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;color:#000;padding:8px 12px;z-index:10;border-radius:6px}main:focus{outline:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--au);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);color:#fff}
.bar{max-width:980px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font:700 1.25rem Georgia,serif;color:#fff;text-decoration:none}
.brand span{color:var(--au)}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto}
nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:20px;white-space:nowrap;font-size:.95rem}
nav a:hover{background:rgba(255,255,255,.18)}
nav a[aria-current="page"]{background:#fff;color:#1f5c42;font-weight:600}
main{max-width:980px;margin:auto;padding:20px 16px 40px}
.crumbs{font-size:.88rem;color:var(--mu);margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border-radius:18px;padding:28px 22px;margin-bottom:26px}
.hero h1{font-size:clamp(1.7rem,5vw,2.6rem)}
.hero p{max-width:560px;margin:0 0 16px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:200px;padding:12px 14px;border-radius:10px;border:0;font:inherit}
.btn{display:inline-block;background:var(--au);color:#241a00;border:0;border-radius:10px;padding:11px 18px;font:600 1rem inherit;text-decoration:none;cursor:pointer}
.btn.alt{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--tx);display:block;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .t{padding:12px 14px}
.card h3{font-size:1.05rem;margin:0 0 4px}
.card p{margin:0;color:var(--mu);font-size:.9rem}
.tag{display:inline-block;font-size:.75rem;background:var(--bd);color:var(--tx);padding:2px 9px;border-radius:12px;margin-bottom:6px}
.art{display:block;width:100%;height:auto}
.c-parques{--a1:#cfe8d5;--a2:#2e7d5b;--a3:#7fbf9a}.c-cultura{--a1:#f3dfc1;--a2:#9b5a2c;--a3:#d89a5b}.c-gastronomia{--a1:#f6d9d0;--a2:#b5402a;--a3:#e8856c}.c-eventos{--a1:#d8d9f2;--a2:#4a4fa3;--a3:#8b90d6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .art{filter:brightness(.8)}}
:root[data-theme="dark"] .art{filter:brightness(.8)}
section{margin-bottom:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips a{padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);text-decoration:none;color:var(--tx);font-size:.92rem}
.chips a[aria-current="page"]{background:var(--g);color:var(--on);border-color:var(--g)}
.two{display:grid;gap:22px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.info{list-style:none;padding:0;margin:0 0 14px}
.info li{padding:8px 0;border-bottom:1px solid var(--bd)}
.video{position:relative;border-radius:14px;overflow:hidden;background:#000}
.video .scene{animation:pan 12s ease-in-out infinite alternate paused}
.video.on .scene{animation-play-state:running}
@keyframes pan{from{transform:scale(1) translateX(0)}to{transform:scale(1.35) translateX(-8%)}}
.video .art{transform-origin:center}
.play{position:absolute;inset:auto auto 12px 12px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:24px;padding:8px 16px;font:600 .95rem inherit;cursor:pointer}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--au);width:0}
.video.on .prog{animation:pg 12s linear infinite}
@keyframes pg{to{width:100%}}
.cap{font-size:.82rem;color:var(--mu);margin:6px 0 0}
.mapbox{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:8px}
.pin{cursor:pointer}.pin circle{fill:var(--g);stroke:#fff;stroke-width:2}.pin.sel circle{fill:var(--au);r:11}
.pin text{font:11px system-ui,sans-serif;fill:var(--tx)}
ol.stops{padding-left:20px}ol.stops li{margin:6px 0}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:20px 16px 30px}
@media(prefers-reduced-motion:reduce){.card{transition:none}.video .scene,.video.on .prog{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#inicio" onclick="event.preventDefault();document.getElementById('app').focus()">Pular para o conteúdo</a>
<header><div class="bar"><a class="brand" href="#inicio">Descubra <span>Curitiba</span></a>
<nav aria-label="Navegação principal"><a href="#inicio" data-n="inicio">Início</a><a href="#explorar" data-n="explorar">Explorar</a><a href="#mapa" data-n="mapa">Mapa</a><a href="#roteiros" data-n="roteiros">Roteiros</a><a href="#favoritos" data-n="favoritos">Favoritos</a></nav></div></header>
<main id="app" tabindex="-1"><noscript>Ative o JavaScript para usar o protótipo.</noscript></main>
<footer>Protótipo acadêmico · <a href="#sobre">Sobre o projeto</a> · Modelagem e Projeto de Aplicações Hipermídia</footer>
<script>
var CATS={parques:"Parques e Natureza",cultura:"Cultura e Arte",gastronomia:"Gastronomia",eventos:"Eventos"};
var P=[
{id:"barigui",n:"Parque Barigui",c:"parques",b:"Santo Inácio",r:"Lago, ciclovia e muito verde para passar o dia.",t:"Um dos parques mais frequentados da cidade, com áreas para caminhada, ciclismo e piquenique. Ótimo para quem busca descanso sem sair de Curitiba.",i:["Melhor horário: manhã ou fim de tarde","Ideal para: famílias e esportes ao ar livre","Acesso: ônibus e carro"],x:90,y:90},
{id:"botanico",n:"Jardim Botânico",c:"parques",b:"Jardim Botânico",r:"Estufa de ferro e jardins franceses.",t:"Cartão-postal da cidade, reúne a famosa estufa metálica e jardins organizados em canteiros. Boa opção para fotos e passeios tranquilos.",i:["Melhor horário: manhã","Ideal para: fotografia e casais","Dica: confirme os horários oficiais antes de ir"],x:250,y:70},
{id:"opera",n:"Ópera de Arame",c:"cultura",b:"Pedreira Paulo Leminski",r:"Teatro de estrutura tubular em meio à mata.",t:"Espaço cultural construído com estrutura de aço e vidro, cercado por vegetação. Recebe espetáculos e é bonito até para quem só quer conhecer o lugar.",i:["Melhor horário: tarde","Ideal para: shows e arquitetura","Dica: veja a programação do dia"],x:300,y:130},
{id:"mon",n:"Museu Oscar Niemeyer",c:"cultura",b:"Centro Cívico",r:"O famoso “Museu do Olho”, com arte e design.",t:"Um dos maiores museus de arte da América Latina, conhecido pelo prédio em formato de olho. Exposições de arte, arquitetura e design.",i:["Melhor horário: tarde","Ideal para: arte e arquitetura","Dica: confira exposições em cartaz"],x:210,y:150},
{id:"mercado",n:"Mercado Municipal",c:"gastronomia",b:"Rebouças",r:"Sabores locais, queijos, doces e café.",t:"Ponto de encontro para provar produtos regionais, de queijos e frios a pratos típicos. Boa parada para almoço rápido durante um roteiro.",i:["Melhor horário: manhã e almoço","Ideal para: almoço e lembranças","Acesso: perto de terminal de ônibus"],x:150,y:190},
{id:"largo",n:"Feira do Largo da Ordem",c:"eventos",b:"Centro Histórico",r:"Feira ao ar livre no centro histórico.",t:"Tradicional feira com artesanato, comidas e música no coração do centro histórico. Acontece aos domingos e combina bem com um passeio a pé.",i:["Quando: domingos","Ideal para: artesanato e caminhada","Dica: vá cedo para evitar o calor e o movimento"],x:70,y:160}
];
var R=[
{id:"um-dia",n:"Curitiba em um dia",d:"Para quem tem pouco tempo",s:["largo","mon","mercado","botanico"]},
{id:"parques",n:"Rota dos parques",d:"Natureza do começo ao fim",s:["botanico","barigui"]},
{id:"cultural",n:"Curitiba cultural",d:"Arte e arquitetura",s:["mon","opera"]}
];
var app=document.getElementById("app"),Q="",fav=[];
try{fav=JSON.parse(localStorage.getItem("dc-fav")||"[]")}catch(e){fav=[]}
function sv(){try{localStorage.setItem("dc-fav",JSON.stringify(fav))}catch(e){}}
function find(id){return P.filter(function(p){return p.id===id})[0]}
function art(c){var s={parques:'<circle cx="250" cy="45" r="20" fill="#e3a72f"/><path d="M0 150 Q80 90 160 140 T320 130 V180 H0Z" fill="var(--a3)"/><g fill="var(--a2)"><path d="M60 140 L80 80 L100 140Z"/><path d="M110 150 L135 70 L160 150Z"/><path d="M200 145 L220 90 L240 145Z"/></g>',cultura:'<circle cx="260" cy="40" r="16" fill="#fff" opacity=".7"/><rect x="40" y="110" width="240" height="70" fill="var(--a3)"/><g fill="var(--a2)"><path d="M70 180 V130 A20 20 0 0 1 110 130 V180Z"/><path d="M140 180 V130 A20 20 0 0 1 180 130 V180Z"/><path d="M210 180 V130 A20 20 0 0 1 250 130 V180Z"/></g><path d="M30 110 H290 L160 60Z" fill="var(--a2)"/>',gastronomia:'<ellipse cx="160" cy="130" rx="95" ry="32" fill="var(--a3)"/><ellipse cx="160" cy="124" rx="70" ry="22" fill="#fff"/><g stroke="var(--a2)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M135 90 q-10 -15 0 -28 q10 -13 0 -26"/><path d="M165 90 q-10 -15 0 -28 q10 -13 0 -26"/><path d="M195 90 q-10 -15 0 -28 q10 -13 0 -26"/></g>',eventos:'<path d="M50 160 L160 50 L270 160Z" fill="var(--a2)"/><path d="M135 160 L160 110 L185 160Z" fill="var(--a1)"/><path d="M20 40 Q160 90 300 40" stroke="var(--a2)" stroke-width="2" fill="none"/><g fill="#e3a72f"><circle cx="70" cy="58" r="7"/><circle cx="130" cy="72" r="7"/><circle cx="190" cy="72" r="7"/><circle cx="250" cy="58" r="7"/></g>'}[c];return '<svg class="art c-'+c+'" viewBox="0 0 320 180" role="img" aria-label="Ilustração: '+CATS[c]+'"><rect width="320" height="180" fill="var(--a1)"/>'+s+'</svg>'}
function card(p){return '<a class="card" href="#local-'+p.id+'">'+art(p.c)+'<div class="t"><span class="tag">'+CATS[p.c]+'</span><h3>'+p.n+'</h3><p>'+p.r+'</p></div></a>'}
function vHome(){var h='<div class="hero"><h1>Descubra os melhores lugares de Curitiba</h1><p>Parques, cultura e gastronomia reunidos em um só lugar. Escolha uma categoria, siga um roteiro pronto ou explore pelo mapa.</p><form class="search" id="sf" role="search"><input id="q" type="search" placeholder="Buscar locais, bairros…" aria-label="Buscar locais"><button class="btn" type="submit">Buscar</button></form></div>';
h+='<section><h2>Explorar por categoria</h2><div class="grid">';for(var k in CATS){h+='<a class="card" href="#explorar-'+k+'">'+art(k)+'<div class="t"><h3>'+CATS[k]+'</h3></div></a>'}
h+='</div></section><section><h2>Roteiros em destaque</h2><div class="grid">';R.forEach(function(r){h+='<a class="card" href="#roteiro-'+r.id+'"><div class="t"><span class="tag">'+r.s.length+' paradas</span><h3>'+r.n+'</h3><p>'+r.d+'</p></div></a>'});
h+='</div></section><section><h2>Lugares para começar</h2><div class="grid">'+P.slice(0,3).map(card).join("")+'</div></section>';return h}
function vExplorar(cat){var l=P.filter(function(p){return(!cat||p.c===cat)&&(!Q||(p.n+p.b+p.r).toLowerCase().indexOf(Q.toLowerCase())>-1)});
var h='<div class="crumbs"><a href="#inicio">Início</a> › Explorar'+(cat?' › '+CATS[cat]:'')+'</div><h1>'+(cat?CATS[cat]:'Explorar Curitiba')+'</h1><div class="chips"><a href="#explorar"'+(cat?'':' aria-current="page"')+'>Todos</a>';
for(var k in CATS)h+='<a href="#explorar-'+k+'"'+(cat===k?' aria-current="page"':'')+'>'+CATS[k]+'</a>';
h+='</div>'+(Q?'<p>Resultados para “'+Q+'”. <a href="#explorar" id="clr">Limpar busca</a></p>':'');
return h+(l.length?'<div class="grid">'+l.map(card).join("")+'</div>':'<p>Nenhum lugar encontrado. Tente outra busca.</p>')}
function vLocal(id){var p=find(id);if(!p)return vHome();var f=fav.indexOf(id)>-1;
var rel=P.filter(function(o){return o.c===p.c&&o.id!==id});
return '<div class="crumbs"><a href="#inicio">Início</a> › <a href="#explorar-'+p.c+'">'+CATS[p.c]+'</a> › '+p.n+'</div><h1>'+p.n+'</h1><div class="two"><div>'+art(p.c)+'<p class="cap">Ilustração do protótipo. Fotos reais serão inseridas na versão final.</p></div><div><span class="tag">'+CATS[p.c]+' · '+p.b+'</span><p>'+p.t+'</p><ul class="info">'+p.i.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul><button class="btn" id="fv" aria-pressed="'+f+'">'+(f?'★ Nos favoritos':'☆ Salvar nos favoritos')+'</button> <a class="btn alt" href="#mapa-'+id+'">Ver no mapa</a> <button class="btn alt" id="cp">Copiar link</button></div></div>'
+'<section style="margin-top:26px"><h2>Vídeo</h2><div class="video" id="vd"><div class="scene">'+art(p.c)+'</div><button class="play" id="pl">▶ Reproduzir</button><div class="prog"></div></div><p class="cap">Vídeo de demonstração animado. O vídeo real do local será inserido na versão final.</p></section>'
+(rel.length?'<section><h2>Veja também</h2><div class="grid">'+rel.map(card).join("")+'</div></section>':'')}
function vMapa(sel){var s=sel&&find(sel);var h='<div class="crumbs"><a href="#inicio">Início</a> › Mapa</div><h1>Mapa interativo</h1><p>Clique em um marcador para ver o local. Mapa esquemático do protótipo.</p><div class="mapbox"><svg viewBox="0 0 400 240" width="100%" role="img" aria-label="Mapa esquemático de Curitiba com marcadores"><rect width="400" height="240" rx="10" fill="var(--bg)"/><path d="M0 120 Q100 80 200 130 T400 100" stroke="var(--bd)" stroke-width="14" fill="none"/><path d="M200 0 V240 M0 190 H400" stroke="var(--bd)" stroke-width="6"/>';
P.forEach(function(p){h+='<a href="#mapa-'+p.id+'" class="pin'+(sel===p.id?' sel':'')+'" aria-label="'+p.n+'"><circle cx="'+p.x+'" cy="'+p.y+'" r="8"/><text x="'+(p.x+12)+'" y="'+(p.y+4)+'">'+p.n+'</text></a>'});
h+='</svg></div>';if(s)h+='<div class="card" style="margin-top:14px"><div class="t"><span class="tag">'+CATS[s.c]+'</span><h3>'+s.n+'</h3><p>'+s.r+'</p><p><a href="#local-'+s.id+'">Abrir página do local →</a></p></div></div>';return h}
function vRoteiros(){return '<div class="crumbs"><a href="#inicio">Início</a> › Roteiros</div><h1>Roteiros prontos</h1><div class="grid">'+R.map(function(r){return '<a class="card" href="#roteiro-'+r.id+'"><div class="t"><span class="tag">'+r.s.length+' paradas</span><h3>'+r.n+'</h3><p>'+r.d+'</p></div></a>'}).join("")+'</div>'}
function vRoteiro(id){var r=R.filter(function(x){return x.id===id})[0];if(!r)return vRoteiros();return '<div class="crumbs"><a href="#inicio">Início</a> › <a href="#roteiros">Roteiros</a> › '+r.n+'</div><h1>'+r.n+'</h1><p>'+r.d+'. Siga as paradas na ordem:</p><ol class="stops">'+r.s.map(function(i){var p=find(i);return '<li><a href="#local-'+i+'">'+p.n+'</a> · '+p.b+'</li>'}).join("")+'</ol><a class="btn" href="#mapa">Ver paradas no mapa</a>'}
function vFav(){var l=fav.map(find).filter(Boolean);return '<div class="crumbs"><a href="#inicio">Início</a> › Favoritos</div><h1>Meus favoritos</h1>'+(l.length?'<div class="grid">'+l.map(card).join("")+'</div>':'<p>Você ainda não salvou nenhum lugar. <a href="#explorar">Explore os locais</a> e toque em “Salvar nos favoritos”.</p>')}
function vSobre(){return '<div class="crumbs"><a href="#inicio">Início</a> › Sobre</div><h1>Sobre o projeto</h1><p>O Descubra Curitiba é um protótipo navegável criado na disciplina de Modelagem e Projeto de Aplicações Hipermídia. A estrutura segue o mapa de navegação proposto: página inicial, categorias, listagem, página de detalhe, mapa, roteiros e favoritos.</p><p><a class="btn" href="#inicio">Voltar ao início</a></p>'}
function route(){var h=(location.hash||"#inicio").slice(1),v,n,t="Descubra Curitiba";
if(h.indexOf("local-")===0){v=vLocal(h.slice(6));n="explorar";var p=find(h.slice(6));if(p)t=p.n}
else if(h.indexOf("explorar")===0){v=vExplorar(CATS[h.slice(9)]?h.slice(9):"");n="explorar"}
else if(h.indexOf("mapa")===0){v=vMapa(h.slice(5));n="mapa"}
else if(h.indexOf("roteiro-")===0){v=vRoteiro(h.slice(8));n="roteiros"}
else if(h==="roteiros"){v=vRoteiros();n="roteiros"}
else if(h==="favoritos"){v=vFav();n="favoritos"}
else if(h==="sobre"){v=vSobre();n=""}
else{v=vHome();n="inicio"}
app.innerHTML=v;document.title=t+" · Descubra Curitiba";
document.querySelectorAll("nav a").forEach(function(a){a.getAttribute("data-n")===n?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
window.scrollTo(0,0);app.focus({preventScroll:true});
var sf=document.getElementById("sf");if(sf)sf.onsubmit=function(e){e.preventDefault();Q=document.getElementById("q").value.trim();if(location.hash==="#explorar")route();else location.hash="#explorar"};
var c=document.getElementById("clr");if(c)c.onclick=function(){Q="";setTimeout(route,0)};
var fb=document.getElementById("fv");if(fb)fb.onclick=function(){var id=h.slice(6),i=fav.indexOf(id);i>-1?fav.splice(i,1):fav.push(id);sv();route()};
var cp=document.getElementById("cp");if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(location.href).then(function(){cp.textContent="Link copiado!"})}catch(e){}};var pl=document.getElementById("pl");if(pl)pl.onclick=function(){var v=document.getElementById("vd");v.classList.toggle("on");pl.textContent=v.classList.contains("on")?"❚❚ Pausar":"▶ Reproduzir"}}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
